name: Release

# Releases ship from GitHub only: this repo is never published on PyPI.
# A vX.Y.Z tag builds the wheel and sdist and attaches them, with SHA256SUMS, to a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check the tag matches pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv run --no-project --python 3.13 python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match version $version in pyproject.toml" >&2
            exit 1
          fi
      - name: Build the wheel and sdist
        run: uv build
      - name: Write SHA256SUMS
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Krova Python SDK $TAG" \
            --notes "Install from this release: pip install \"krova @ git+https://github.com/$GH_REPO@$TAG\". Check the files against SHA256SUMS. Never published on PyPI." \
            "${flags[@]}"
