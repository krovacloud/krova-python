name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: uv sync --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  adapters:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - extra: langchain
            tests: tests/test_integration_langchain.py
          - extra: crewai
            tests: tests/test_integration_crewai.py
          - extra: openai-agents
            tests: tests/test_integration_openai_agents.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: uv sync --python 3.13 --extra ${{ matrix.extra }}
      - name: Test
        run: uv run pytest tests/test_integrations_core.py ${{ matrix.tests }}
