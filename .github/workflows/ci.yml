name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  adapters:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - extra: langchain
            tests: tests/test_integration_langchain.py
          - extra: crewai
            tests: tests/test_integration_crewai.py
          - extra: openai-agents
            tests: tests/test_integration_openai_agents.py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --python 3.13 --extra ${{ matrix.extra }}
      - name: Test
        run: uv run pytest tests/test_integrations_core.py ${{ matrix.tests }}
