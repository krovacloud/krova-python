[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krova"
version = "0.1.2"
description = "Python SDK for the Krova Cloud API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.23.0,<0.29.0",
    "attrs>=22.2.0",
    "python-dateutil>=2.8.1,<3.0.0",
    "paramiko>=5.1,<6",
    "cryptography>=42",
]

[project.optional-dependencies]
langchain = ["langchain-core>=1.7.6,<2"]
crewai = ["crewai>=1.15.39,<2"]
openai-agents = ["openai-agents>=0.24.0,<1"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["krova"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["krova/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
# crewai pins openai<3 and openai-agents needs openai>=3, so they cannot share one environment.
conflicts = [[{ extra = "crewai" }, { extra = "openai-agents" }]]
